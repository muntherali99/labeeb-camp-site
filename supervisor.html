<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة المشرف | المخيم الشتوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1B1536">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/config.js"></script>
<style>
:root{
  --ink:#231F3A;--muted:#6B6785;--brand:#544283;--deep:#2B2350;--night:#1B1536;--red:#E2432B;--amber:#E08A1E;
  --green:#14915F;--green-t:#E3F5EC;--red-t:#FCE7E2;--amber-t:#FFF1DE;--line:#E8E4F1;--bg:#F4F2F9;
  --sh:0 8px 26px rgba(43,35,80,.08),0 1px 4px rgba(43,35,80,.04);--r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);font-size:15.5px;line-height:1.55;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.i{width:1em;height:1em}
[hidden]{display:none!important}
a{color:inherit}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 70% at 80% 0,#4A3A86 0,transparent 55%),radial-gradient(90% 60% at 0 100%,rgba(240,136,74,.35) 0,transparent 60%),linear-gradient(170deg,#1F1840,#141029)}
.lg-card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 30px 70px rgba(0,0,0,.35);text-align:center}
.lg-card .logo{height:44px;width:auto;margin:0 auto}
.lg-ic{width:58px;height:58px;border-radius:18px;margin:20px auto 10px;background:linear-gradient(135deg,var(--brand),var(--deep));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(84,66,131,.35)}
.lg-ic svg{width:28px;height:28px}
.lg-card h1{font-family:'Cairo';font-weight:900;font-size:22px;color:var(--deep)}
.lg-card p{color:var(--muted);font-size:14px;margin-top:2px}
.field{width:100%;border:2px solid var(--line);border-radius:15px;padding:12px 14px;font-size:16px;background:#FCFBFE;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 4px #EFEBF8}
.lg-card .field{margin-top:18px;text-align:center;letter-spacing:1px;direction:ltr}
.btn{border:0;border-radius:15px;min-height:48px;padding:0 16px;font-family:'Cairo';font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--deep));color:#fff;box-shadow:0 8px 18px rgba(84,66,131,.28)}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--deep)}
.btn.soft{background:#F1EEF8;color:var(--deep)}
.btn[disabled]{opacity:.6;pointer-events:none}
.lg-card .btn{width:100%;margin-top:12px;min-height:52px;font-size:17px}
.lg-err{color:#C0331F;font-weight:700;font-size:14px;margin-top:10px;min-height:20px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite}
.spin.d{border-color:#E2DDF0;border-top-color:var(--brand)}
@keyframes rot{to{transform:rotate(360deg)}}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#231C47,#16112E);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 6px 20px rgba(20,16,41,.25)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .logo{height:30px;width:auto;flex:none}
.bar .tt{flex:1;min-width:0}
.bar h1{font-family:'Cairo';font-weight:900;font-size:16.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{display:block;font-size:12px;color:#C9C1EA;font-weight:600}
.ib{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center}
.ib svg{width:19px;height:19px}
.ib.spinning svg{animation:rot 1s linear infinite}

main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
.demo{background:#FFF4E5;color:#7A4E14;border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.demo svg{width:18px;height:18px;flex:none}

/* registration switch */
.regsw{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:14px}
.regsw .d{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-t);flex:none}
.regsw.off .d{background:var(--red);box-shadow:0 0 0 4px var(--red-t)}
.regsw b{font-family:'Cairo';font-weight:800;color:var(--deep)}
.regsw span{display:block;font-size:12.5px;color:var(--muted)}
.regsw .tx{flex:1}
.tg{flex:none;width:54px;height:32px;border-radius:99px;border:0;background:#D7D2E6;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.tg.on{background:var(--green)}
.tg.on::after{transform:translateX(-22px)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px 14px 12px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-30px;top:-30px;background:var(--t,#F1EEF8);opacity:.8}
.kpi .k-ic{position:relative;z-index:1;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--t,#F1EEF8);color:var(--c,var(--brand))}
.kpi .k-ic svg{width:19px;height:19px}
.kpi b{display:block;font-family:'Cairo';font-weight:900;font-size:32px;line-height:1.1;margin-top:8px;color:var(--c,var(--deep));font-variant-numeric:tabular-nums}
.kpi small{display:block;font-weight:700;color:var(--muted);font-size:13.5px}
.kpi em{position:absolute;top:14px;left:14px;z-index:1;font-style:normal;font-family:'Cairo';font-weight:800;font-size:12px;color:var(--c);background:#fff;border-radius:99px;padding:1px 8px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}

.grid2{display:grid;gap:14px;margin-top:14px}
@media(min-width:900px){.grid2{grid-template-columns:360px 1fr}}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card h3{font-family:'Cairo';font-weight:900;font-size:17px;color:var(--deep);display:flex;align-items:center;gap:8px}
.card h3 svg{width:20px;height:20px;color:var(--brand)}
.pad{padding:16px}

.donut{display:flex;align-items:center;gap:16px;margin-top:10px}
.donut svg{width:132px;height:132px;flex:none}
.donut .lgd{display:grid;gap:8px;flex:1}
.lgd div{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.lgd i{width:11px;height:11px;border-radius:4px;flex:none}
.lgd b{margin-inline-start:auto;font-family:'Cairo';font-weight:900}

.cats{display:grid;gap:12px;margin-top:4px}
.cat{border:2px solid #F0EDF6;border-radius:18px;padding:12px 14px}
.cat .ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat .ch b{font-family:'Cairo';font-weight:900;font-size:16px;color:var(--deep)}
.cat .ch span{font-size:13px;color:var(--muted);font-weight:700}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#EFECF5;margin:10px 0 8px}
.sbar i{display:block;height:100%;transition:width .6s}
.cat .nums{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.cat .nums b{font-family:'Cairo';font-weight:900;color:var(--ink)}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#EDEAF5;border-radius:18px;margin-top:14px}
@media(min-width:760px){.tabs{grid-template-columns:repeat(4,1fr)}}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;border-radius:13px;padding:9px 12px;font-family:'Cairo';font-weight:800;font-size:14.5px;color:#5D5880;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:17px;height:17px}
.tabs button .n{font-family:'Cairo';font-size:12px;background:rgba(84,66,131,.12);border-radius:99px;padding:0 7px;min-width:22px}
.tabs button.on{background:#fff;color:var(--deep);box-shadow:0 3px 10px rgba(43,35,80,.1)}
.tabs button.on .n{background:var(--brand);color:#fff}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.search{flex:1 1 220px;position:relative}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .field{padding-right:40px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px 6px;font-weight:800;font-size:13.5px;color:#4E4970}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}

.list{display:grid;gap:10px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.list.three{grid-template-columns:1fr 1fr 1fr}}
.rc{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px;border-inline-start:5px solid var(--green);position:relative}
.rc.no{border-inline-start-color:var(--red)}
.rc .rh{display:flex;align-items:flex-start;gap:10px}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--deep))}
.rc .nm{flex:1;min-width:0}
.rc .nm b{display:block;font-family:'Cairo';font-weight:900;font-size:16px;color:var(--deep);line-height:1.35}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px 2px;background:#F1EEF8;color:var(--brand)}
.tag.g{background:var(--green-t);color:#0F7049}
.tag.r{background:var(--red-t);color:#B3311C}
.tag.a{background:var(--amber-t);color:#9A5A0B}
.tag.w{background:#FFF0F0;color:#C0331F}
.menu{flex:none;width:34px;height:34px;border-radius:11px;border:0;background:#F4F2F9;color:var(--muted);display:flex;align-items:center;justify-content:center}
.menu svg{width:17px;height:17px}
.kv{display:grid;gap:6px;margin-top:10px;font-size:14px}
.kv div{display:flex;gap:8px;align-items:flex-start}
.kv span{flex:none;color:var(--muted);font-weight:700;min-width:86px}
.kv b{font-weight:700;color:var(--ink);word-break:break-word}
.alert{display:flex;gap:8px;align-items:flex-start;background:#FFF3F1;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:14px;font-weight:700;color:#9B2A17}
.alert svg{flex:none;width:17px;height:17px;margin-top:2px}
.ph{display:flex;gap:6px;margin-top:10px}
.ph a{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:8px 6px;font-weight:800;font-size:13.5px;text-decoration:none;background:#F4F2F9;color:var(--deep)}
.ph a svg{width:16px;height:16px}
.ph a.wa{background:#E6F7EE;color:#0F7049}
.ph .num{direction:ltr;font-family:'Cairo';font-weight:800}
.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#9A95B3;font-weight:700}
.pop{position:absolute;top:50px;left:12px;z-index:5;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(20,16,41,.22);padding:6px;min-width:190px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px;text-align:start}
.pop button:hover{background:#F4F2F9}
.pop button svg{width:17px;height:17px;color:var(--muted)}
.pop button.dng{color:#C0331F}
.pop button.dng svg{color:#C0331F}

.empty{text-align:center;padding:36px 16px;color:var(--muted);font-weight:700}
.empty svg{width:40px;height:40px;margin:0 auto 8px;color:#C9C2DC}

.grp{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.grp .gh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grp .gh b{font-family:'Cairo';font-weight:900;font-size:16.5px;color:var(--deep)}
.grp ol{margin:10px 0 0;padding-inline-start:22px;columns:2 220px;column-gap:28px}
.grp li{padding:3px 0;font-weight:700;break-inside:avoid}
.grp li::marker{color:var(--muted);font-family:'Cairo';font-weight:800;font-size:13px}
.grp .sb{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{min-height:38px;font-size:13.5px;border-radius:12px;padding:0 12px}
.btn.sm svg{width:16px;height:16px}

.ci{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;border:2px solid transparent;transition:all .2s;width:100%;text-align:start}
.ci .bx{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid #CFC8E0;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s}
.ci .bx svg{width:20px;height:20px;stroke-width:3.2;opacity:0}
.ci b{display:block;font-family:'Cairo';font-weight:800;font-size:15.5px;color:var(--deep)}
.ci small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.ci .tx{flex:1;min-width:0}
.ci.on{border-color:var(--green);background:#F5FBF8}
.ci.on .bx{background:var(--green);border-color:var(--green)}
.ci.on .bx svg{opacity:1}
.ci.busy{opacity:.55;pointer-events:none}
.ciprog{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.ciprog .row{display:flex;justify-content:space-between;align-items:baseline}
.ciprog b{font-family:'Cairo';font-weight:900;font-size:28px;color:var(--green)}
.ciprog span{font-weight:700;color:var(--muted)}

.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.upd{text-align:center;color:#9A95B3;font-size:12.5px;font-weight:700;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:60;background:var(--deep);color:#fff;
  border-radius:14px;padding:10px 16px;font-weight:700;font-size:14.5px;transition:all .3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 0;color:var(--muted);font-weight:700}

/* print */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;font-family:'Tajawal',sans-serif;color:#000}
  #printArea h2{font-family:'Cairo';font-size:20px;margin-bottom:4px}
  #printArea p{font-size:12px;margin-bottom:10px}
  #printArea table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px}
  #printArea th,#printArea td{border:1px solid #999;padding:5px 6px;text-align:right;vertical-align:top}
  #printArea th{background:#eee}
  #printArea h4{font-family:'Cairo';margin:6px 0}
  @page{size:A4;margin:12mm}
}
</style>
</head>

    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s(بن|ابن|ال)(?=\s)/g, ' ').replace(/\s(بن|ابن|ال)(?=\s)/g, ' ')
    .replace(/\s+/g, ' ').replace(/(^|\s)(عبد|ابو)\s/g, '$1$2').trim();
}
function toks(s) { return nkey(s).split(' ').filter(Boolean); }
function sameName(a, b) {
  const A = nkey(a), B = nkey(b);
  if (A === B) return true;
  const x = toks(a), y = toks(b);
  if (x.length < 2 || y.length < 2) return false;
  if (x[0] !== y[0] || x[x.length - 1] !== y[y.length - 1]) return false;
  if (x.length >= 3 && y.length >= 3 && x[1] !== y[1]) return false;
  return true;
}

}

/* ── compute ── */
function compute() {
  const rows = D.rows.slice().sort((a, b) => (b.up || b.ts) - (a.up || a.ts));
  const roster = D.roster;
  const used = new Set();
  rows.forEach((r) => {
    r.match = -1;
    for (let i = 0; i < roster.length; i++) {
      if (used.has(i)) continue;
      if ((!roster[i].cat || roster[i].cat === r.cat) && sameName(r.name, roster[i].name)) { r.match = i; used.add(i); break; }
    }
  });
  const pending = roster.map((x, i) => Object.assign({ i: i }, x)).filter((x) => !used.has(x.i));
  const yes = rows.filter((r) => r.going), no = rows.filter((r) => !r.going);
  const byCat = {};
  CATS.forEach((c) => {
    const total = roster.filter((x) => x.cat === c).length;
    const y = yes.filter((r) => r.cat === c).length, n = no.filter((r) => r.cat === c).length;
    const extra = rows.filter((r) => r.cat === c && r.match < 0).length;
    byCat[c] = { total: total, yes: y, no: n, wait: pending.filter((x) => x.cat === c).length, extra: extra };
  });
  const health = yes.filter((r) => r.health && !/^(لا|لا يوجد|لايوجد|لا شيء|لاشيء|ما فيه|مافيه|ما في|لا توجد|سليم|-|\.|no|none)$/i.test(r.health.trim()));
  const ride = yes.filter((r) => r.ride === 'يحتاج تنسيق توصيل');
  const unmatched = rows.filter((r) => r.match < 0 && roster.length);
  const arrived = yes.filter((r) => r.arrived);
  return { rows, yes, no, pending, byCat, health, ride, unmatched, arrived };
}

function setData(r) {
  D = { rows: r.rows || [], roster: r.roster || [], open: r.open !== false, sheetUrl: r.sheetUrl || '' };
  const t = new Date(r.now || Date.now());
  $('upd').textContent = 'آخر تحديث ' + t.toLocaleTimeString('ar-SA-u-nu-latn', { hour: 'numeric', minute: '2-digit' });
  render();
}

function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
function donut(y, n, w) {
  const tot = y + n + w || 1, R = 52, C = 2 * Math.PI * R;
  let off = 0; let segs = '';

    off += len;
  });
  const resp = pct(y + n, y + n + w);
  return '<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#EFECF5" stroke-width="16"/>' + segs +
    '<text x="66" y="66" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="26" fill="#2B2350">' + resp + '%</text>' +

  if (t.closest('#tgOpen')) {
    const want = !D.open;
    if (!confirm(want ? 'فتح التسجيل من جديد؟' : 'إغلاق التسجيل؟ ستظهر للزوار رسالة «التسجيل مغلق».')) return;
    const res = await api({ action: 'setOpen', open: want });
    if (res.ok) { D.open = res.open !== false; render(); toast(D.open ? 'التسجيل مفتوح ✓' : 'تم إغلاق التسجيل'); } else toast('تعذّر التغيير');
    return;
  }
  if (t.closest('#csv')) return csv();
  if (t.closest('#print')) return printList();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    F.q = e.target.value.trim(); const pos = e.target.selectionStart;
    $('tabBody').innerHTML = tabBody(); const q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {}
  }
});

function csv() {
  const head = ['الاسم', 'الفئة', 'الحالة', 'المسجِّل', 'ملاحظات صحية', 'سبب الاعتذار', 'ملاحظات', 'رقم التأكيد', 'وقت التسجيل', 'الوصول للمخيم'];
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(C.rows.map((r) => [r.name, CAT_LABEL[r.cat] || r.cat, r.going ? 'سيحضر' : 'معتذر', r.by, r.health, r.reason, r.notes, r.code, fmt(r.ts), r.arrived ? fmt(r.arrived) : ''].map(q).join(',')));
  if (C.pending.length) { lines.push(''); lines.push(q('لم يردّوا بعد')); C.pending.forEach((x) => lines.push([x.name, CAT_LABEL[x.cat] || x.cat, 'لم يرد'].map(q).join(','))); }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'تسجيل-المخيم-الشتوي.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('تم التصدير ✓');
}
function printList() {
  let h = '<h2>كشف حضور ' + esc(CFG.TITLE || 'المخيم الشتوي') + ' — لبيب الرياض</h2><p>' + esc((CFG.START_DAY || '') + ' · ' + (CFG.START_TIME || '')) + ' — المؤكدون: ' + C.yes.length + ' · طُبع ' + fmt(Date.now()) + '</p>';
  CATS.forEach((c) => {
    const l = C.yes.filter((r) => r.cat === c).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    if (!l.length) return;
    h += '<h4>' + CAT_LABEL[c] + ' (' + l.length + ')</h4><table><tr><th>#</th><th>الاسم</th><th>ملاحظات صحية</th><th>ملاحظات</th><th>وصل ✓</th></tr>' +
      l.map((r, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(C.health.indexOf(r) >= 0 ? r.health : '') + '</td><td>' + esc(r.notes) + '</td><td style="width:50px"></td></tr>').join('') + '</table>';
  });
  $('printArea').innerHTML = h; window.print();
}

/* ── demo (preview without API) ── */
let DEMO = null;
function demoApi(p) {
  if (!DEMO) {
    const roster = [['شبل تجريبي ١', 'أشبال'], ['شبل تجريبي ٢', 'أشبال'], ['شبل تجريبي ٣', 'أشبال'], ['شبل تجريبي ٤', 'أشبال'], ['شبل تجريبي ٥', 'أشبال'], ['شبل تجريبي ٦', 'أشبال'], ['شبل تجريبي ٧', 'أشبال'], ['شبل تجريبي ٨', 'أشبال'], ['شبل تجريبي ٩', 'أشبال'], ['شبل تجريبي ١٠', 'أشبال'],
      ['قائد تجريبي ١', 'قادة'], ['قائد تجريبي ٢', 'قادة'], ['قائد تجريبي ٣', 'قادة'], ['قائد تجريبي ٤', 'قادة'], ['قائد تجريبي ٥', 'قادة'], ['قائد تجريبي ٦', 'قادة']].map((x) => ({ name: x[0], cat: x[1] }));
    const n = Date.now();
    const mk = (i, name, cat, going, extra) => Object.assign({ id: 'd' + i, ts: n - i * 3.6e6, up: 0, name: name, cat: cat, going: going, by: i % 3 ? 'ولي الأمر' : 'الطالب', phone: '', phone2: '', ride: '', health: '', reason: '', notes: '', code: String(1200 + i * 37), arrived: 0 }, extra || {});
    DEMO = { ok: true, open: true, sheetUrl: '', roster: roster, rows: [
      mk(1, 'شبل تجريبي ١', 'أشبال', true, { health: 'حساسية من الفول السوداني' }),
      mk(2, 'شبل تجريبي ٢', 'أشبال', true),
      mk(3, 'شبل تجريبي ٣', 'أشبال', false, { reason: 'سفر عائلي' }),
      mk(4, 'شبل تجريبي ٤', 'أشبال', true, { health: 'لا يوجد' }),
      mk(5, 'شبل تجريبي ٥', 'أشبال', true, { notes: 'أول مرة يبيت خارج البيت' }),
      mk(6, 'قائد تجريبي ١', 'قادة', true),
      mk(7, 'قائد تجريبي ٢', 'قادة', true),
      mk(8, 'قائد تجريبي ٣', 'قادة', false, { reason: 'اختبارات' }),
      mk(9, 'قائد تجريبي ٤', 'قادة', true, { health: 'ربو خفيف — معه بخاخ' }),
      mk(10, 'قائد تجريبي ٧', 'قادة', true)
    ] };
  }
  return new Promise((ok) => setTimeout(() => {
    const r = DEMO.rows.find((x) => x.id === p.id);
    if (p.action === 'list') ok(Object.assign({}, DEMO, { rows: DEMO.rows.map((x) => Object.assign({}, x)), now: Date.now() }));
    else if (p.action === 'setOpen') { DEMO.open = !!p.open; ok({ ok: true, open: DEMO.open }); }
    else if (p.action === 'checkin' && r) { r.arrived = p.on ? Date.now() : 0; ok({ ok: true, arrived: r.arrived }); }
    else if (p.action === 'setStatus' && r) { r.going = !!p.going; ok({ ok: true }); }
    else if (p.action === 'delete' && r) { DEMO.rows = DEMO.rows.filter((x) => x !== r); ok({ ok: true }); }
    else ok({ ok: false, error: 'not_found' });
  }, 350));
}

/* ── init ── */
(async function init() {
  const saved = ss.get();
  if (!HAS_API) { $('pass').placeholder = 'وضع المعاينة: اكتب أي شيء'; }
  if (saved) {
    PASS = saved;
    const r = await api({ action: 'list' });
    if (r.ok) return enter(r);
    ss.set('');
  }
  $('pass').focus();
})();
})();
